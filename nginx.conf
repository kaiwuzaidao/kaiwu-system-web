server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # 这是面向浏览器的公开 API 路由；上游只能由部署者通过运行时配置指定。
        proxy_pass http://${KAIWU_GATEWAY_UPSTREAM}; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带内容指纹的静态资源可长期缓存：文件名随内容变化，不会取到过期内容。
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存：它引用的资源文件名会随每次构建变化，
    # 缓存住会导致新旧产物混用（表现为 Loading chunk failed）。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

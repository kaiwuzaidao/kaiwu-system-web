server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/agent/ask {
        proxy_pass http://${KAIWU_GATEWAY_UPSTREAM}; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_read_timeout 160s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/agent/conversations/[0-9]+/messages$ {
        proxy_pass http://${KAIWU_GATEWAY_UPSTREAM}; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_read_timeout 160s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 这是面向浏览器的公开 API 路由；上游只能由部署者通过运行时配置指定。
        proxy_pass http://${KAIWU_GATEWAY_UPSTREAM}; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 本机体验：./kaiwu project up 把业务前端接到平台同源的 /apps/{projectCode}/ 下（ADR 0025）。
    # 目录只由本机命令写入；服务器与集群部署不挂载它，通配匹配不到文件时不产生任何路由。
    # 其中的 location 必须用 ^~，否则下面的静态资源正则会抢走业务前端的 js/css 请求。
    include /etc/nginx/kaiwu-apps/*.conf;

    # 带内容指纹的静态资源可长期缓存：文件名随内容变化，不会取到过期内容。
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存：它引用的资源文件名会随每次构建变化，
    # 缓存住会导致新旧产物混用（表现为 Loading chunk failed）。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

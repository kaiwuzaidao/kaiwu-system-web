name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 与 Dockerfile 里的构建步骤保持一致：setup 生成 API 客户端等产物，
      # 少了它 typecheck 会因为缺文件而失败。
      - run: pnpm run setup
      - run: pnpm typecheck
      - run: pnpm build
